{% extends 'base.html' %}

{% block content %}
<h2 class="mt-4">Add Word</h2>
<form method="post" action="/add_word" class="mt-3" style="max-width: 400px;">
    <div class="mb-3">
        <label for="theme_id" class="form-label">Theme</label>
        <select class="form-select" id="theme_id" name="theme_id" required>
            {% for theme in themes %}
            <option value="{{ theme.id }}" {% if preselected == theme.id %}selected{% endif %}>{{ theme.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="word" class="form-label">Word</label>
        <input type="text" class="form-control" id="word" name="word" required autofocus>
    </div>
    <div class="mb-3">
        <label for="translation" class="form-label">Translation</label>
        <input type="text" class="form-control" id="translation" name="translation" required>
    </div>
    <button type="submit" class="btn btn-primary">Add</button>
</form>
{% endblock %}
