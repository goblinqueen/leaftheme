{% extends 'base.html' %}

{% block content %}
<h2 class="mt-4">Add Word</h2>

<form method="post" action="/add_word" class="mt-3" style="max-width: 420px;">
    {% if error %}
    <div class="alert alert-warning py-2">{{ error }}</div>
    {% endif %}
    <div class="mb-2">
        <label class="form-label small text-muted mb-1">Finnish</label>
        <input type="text" name="word" id="word-input" class="form-control" required autofocus
               value="{{ prefill_word or '' }}">
    </div>
    <div class="mb-2">
        <label class="form-label small text-muted mb-1">Russian</label>
        <div class="input-group">
            <input type="text" name="translation" id="translation-input" class="form-control" required
                   value="{{ prefill_translation or '' }}">
            <button type="button" id="btn-glosbe" class="btn btn-outline-secondary" title="Fetch from Glosbe">
                <span id="glosbe-label">Glosbe</span>
                <span id="glosbe-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
            <a id="glosbe-link" href="#" target="_blank" class="btn btn-outline-secondary d-none">↗</a>
        </div>
        <div id="glosbe-warning" class="text-warning small d-none">No translation found.</div>
    </div>
    <div class="mb-2">
        <label class="form-label small text-muted mb-1">Theme</label>
        <select name="theme_id" class="form-select" required>
            {% for theme in themes %}
            <option value="{{ theme.id }}" {% if preselected == theme.id %}selected{% endif %}>{{ theme.name }}</option>
            {% endfor %}
        </select>
    </div>
    <input type="hidden" name="redirect_to" value="{{ redirect_to or '' }}">
    <button type="submit" class="btn btn-primary btn-sm">Add</button>
</form>

<script>
document.getElementById('btn-glosbe').addEventListener('click', () => {
    const word = document.getElementById('word-input').value.trim();
    if (!word) { alert('Enter a Finnish word first.'); return; }

    const btn = document.getElementById('btn-glosbe');
    const label = document.getElementById('glosbe-label');
    const spinner = document.getElementById('glosbe-spinner');
    btn.disabled = true;
    label.classList.add('d-none');
    spinner.classList.remove('d-none');

    fetch('/glosbe?word=' + encodeURIComponent(word) + '&dir=fi-ru')
        .then(r => r.json())
        .then(data => {
            const warning = document.getElementById('glosbe-warning');
            if (data.translation) {
                document.getElementById('translation-input').value = data.translation;
                warning.classList.add('d-none');
            } else {
                warning.classList.remove('d-none');
            }
            const link = document.getElementById('glosbe-link');
            link.href = 'https://glosbe.com/fi/ru/' + encodeURIComponent(word);
            link.classList.remove('d-none');
        })
        .catch(() => alert('Glosbe fetch failed.'))
        .finally(() => {
            btn.disabled = false;
            label.classList.remove('d-none');
            spinner.classList.add('d-none');
        });
});
</script>
{% endblock %}
