{% extends 'base.html' %}

{% block content %}
<h2 class="mt-4">Review</h2>
<p class="text-muted">{{ total_due }} words due for review.</p>

<a href="/review/start" class="btn btn-primary mb-4">Review All ({{ total_due }})</a>

<ul class="list-group" style="max-width: 500px;">
    {% for theme, due in theme_counts %}
    {% if due > 0 %}
    <a href="/review/start?theme_id={{ theme.id }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
        {{ theme.name }}
        <span class="badge bg-primary rounded-pill">{{ due }}</span>
    </a>
    {% endif %}
    {% endfor %}
</ul>
{% endblock %}
