{% extends 'base.html' %}

{% block content %}
<p>
   <form action ="/search">
   <label for="query"></label>
   <input type="text" id="query" name="query" autofocus> <input type="submit" value="Search">
</form>

</p>
<h2 class="mt-4">{{ query }}</h2>
<p>
    <ul>
    {% for res in results %}
    <li><a href="/word/{{ res[1].id }}">{{ res[1] }}</a> — {{ res[1].translation }} <sup><a href="/words/{{ res[2] }}">{{ res[3] }}</a></sup> <br /></li>
    {% endfor %}
    </ul>
</p>
{% endblock %}
