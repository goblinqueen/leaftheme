{% extends 'base.html' %}

{% block content %}
<p>
   <form action ="/search">
   <label for="query"></label>
   <input type="text" id="query" name="query" autofocus> <input type="submit" value="Search">
</form>

</p>
<div class="d-flex align-items-center gap-3 mt-4">
    <h2 class="mb-0">{{ query }}</h2>
    {% if query %}
    <a href="/add_word?word={{ query | urlencode }}" class="btn btn-outline-primary btn-sm">+ Add</a>
    {% endif %}
</div>
<ul class="mt-3">
{% for res in results %}
<li><a href="/word/{{ res[1].id }}">{{ res[1] }}</a> — {{ res[1].translation }} <sup><a href="/words/{{ res[2] }}">{{ res[3] }}</a></sup></li>
{% endfor %}
</ul>
{% endblock %}
