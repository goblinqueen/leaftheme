{% extends 'base.html' %}

{% block content %}
<div class="mt-4 mb-3">
    <small id="progress-text" class="text-muted"></small>
    <div class="progress mt-1" style="height: 6px;">
        <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 0%"></div>
    </div>
</div>

<div class="card mx-auto mt-4" style="max-width: 500px;">
    <div class="card-body text-center py-5">
        <h2 id="word-display" class="card-title mb-4"></h2>

        <!-- Flashcard mode elements -->
        <p id="translation-display" class="fs-4 text-muted d-none"></p>

        <div id="flashcard-buttons" class="mt-4 d-none">
            <button id="btn-reveal" class="btn btn-primary me-2">Reveal <kbd>Space</kbd></button>
            <button id="btn-fc-dont-know" class="btn btn-outline-danger">Don't Know <kbd>Esc</kbd></button>
        </div>

        <!-- Type-in mode elements -->
        <div id="typein-area" class="d-none">
            <div class="input-group mb-3" style="max-width: 350px; margin: 0 auto;">
                <input type="text" id="answer-input" class="form-control" placeholder="Finnish word...">
                <button id="btn-check" class="btn btn-primary">Check</button>
            </div>
            <button id="btn-ti-dont-know" class="btn btn-outline-danger btn-sm">Don't Know <kbd>Esc</kbd></button>
        </div>

        <div id="feedback-area" class="d-none mt-3">
            <p id="feedback-text"></p>
        </div>

        <!-- Sort rating buttons (shared) -->
        <div id="rating-buttons" class="d-none mt-3">
            <p class="text-muted">Sort this word:</p>
            <button class="btn btn-success me-2 btn-rating" data-rating="3">Know Well <kbd>Enter</kbd></button>
            <button class="btn btn-primary me-2 btn-rating" data-rating="2">Know <kbd>1</kbd></button>
            <button class="btn btn-danger btn-rating" data-rating="1">Don't Know <kbd>2</kbd></button>
        </div>
    </div>
</div>

<script id="words-data" type="application/json">{{ words_json | safe }}</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const words = JSON.parse(document.getElementById('words-data').textContent);
    const sourceThemeId = {{ source_theme_id }};
    const targetThemes = {{ target_themes_json | safe }};
    let currentIndex = 0;
    const results = {};

    // Shared elements
    const wordDisplay = document.getElementById('word-display');
    const ratingButtons = document.getElementById('rating-buttons');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');

    // Flashcard elements
    const translationDisplay = document.getElementById('translation-display');
    const flashcardButtons = document.getElementById('flashcard-buttons');
    const revealBtn = document.getElementById('btn-reveal');
    const fcDontKnowBtn = document.getElementById('btn-fc-dont-know');

    // Type-in elements
    const typeinArea = document.getElementById('typein-area');
    const answerInput = document.getElementById('answer-input');
    const checkBtn = document.getElementById('btn-check');
    const tiDontKnowBtn = document.getElementById('btn-ti-dont-know');
    const feedbackArea = document.getElementById('feedback-area');
    const feedbackText = document.getElementById('feedback-text');

    function hideAll() {
        translationDisplay.classList.add('d-none');
        flashcardButtons.classList.add('d-none');
        typeinArea.classList.add('d-none');
        feedbackArea.classList.add('d-none');
        ratingButtons.classList.add('d-none');
    }

    function showWord() {
        const w = words[currentIndex];
        hideAll();
        updateProgress();

        if (w.mode === 'flashcard') {
            // Flashcard: show Finnish word, reveal Russian translation
            wordDisplay.textContent = w.word;
            translationDisplay.textContent = '';
            flashcardButtons.classList.remove('d-none');
        } else {
            // Type-in: show Russian translation, type Finnish word
            wordDisplay.textContent = w.translation;
            answerInput.value = '';
            answerInput.disabled = false;
            checkBtn.disabled = false;
            typeinArea.classList.remove('d-none');
            setTimeout(() => answerInput.focus(), 0);
        }
    }

    function updateProgress() {
        const pct = (currentIndex + 1) / words.length * 100;
        progressBar.style.width = pct + '%';
        progressText.textContent = (currentIndex + 1) + ' / ' + words.length;
    }

    function showRating() {
        ratingButtons.classList.remove('d-none');
    }

    function recordAndAdvance(rating) {
        results[words[currentIndex].id] = rating;
        currentIndex++;
        if (currentIndex < words.length) {
            showWord();
        } else {
            submitResults();
        }
    }

    // --- Flashcard handlers ---
    revealBtn.addEventListener('click', () => {
        translationDisplay.textContent = words[currentIndex].translation;
        translationDisplay.classList.remove('d-none');
        flashcardButtons.classList.add('d-none');
        showRating();
    });

    fcDontKnowBtn.addEventListener('click', () => {
        recordAndAdvance(0);
    });

    // --- Type-in handlers ---
    function checkAnswer() {
        const answer = answerInput.value.trim();
        if (!answer) return;

        answerInput.disabled = true;
        checkBtn.disabled = true;

        fetch('/test/check_answer', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                word_id: words[currentIndex].id,
                answer: answer
            })
        })
        .then(r => r.json())
        .then(data => {
            typeinArea.classList.add('d-none');

            if (data.matched) {
                feedbackText.innerHTML =
                    '<span class="text-success">Your answer:</span> ' + answer +
                    '<br><span class="text-muted">Correct:</span> ' + data.correct_answer;
                feedbackArea.classList.remove('d-none');
                showRating();
            } else {
                // Not matched — sort as To Reverse
                recordAndAdvance(0);
            }
        });
    }

    checkBtn.addEventListener('click', checkAnswer);
    answerInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') checkAnswer();
    });

    tiDontKnowBtn.addEventListener('click', () => {
        recordAndAdvance(0);
    });

    // --- Rating handlers ---
    ratingButtons.querySelectorAll('.btn-rating').forEach(btn => {
        btn.addEventListener('click', () => {
            recordAndAdvance(parseInt(btn.dataset.rating));
        });
    });

    // --- Keyboard shortcuts ---
    document.addEventListener('keydown', (e) => {
        // Don't intercept when typing in the input
        if (document.activeElement === answerInput && e.key !== 'Escape') return;

        // Rating buttons: 1=Know Well, 2=Know, 3=Don't Know
        if (!ratingButtons.classList.contains('d-none')) {
            if (e.key === 'Enter') { e.preventDefault(); recordAndAdvance(3); return; }
            if (e.key === '1') { e.preventDefault(); recordAndAdvance(2); return; }
            if (e.key === '2') { e.preventDefault(); recordAndAdvance(1); return; }
        }

        // Flashcard: Space=Reveal, Escape=Don't Know
        if (!flashcardButtons.classList.contains('d-none')) {
            if (e.key === ' ') { e.preventDefault(); revealBtn.click(); return; }
            if (e.key === 'Escape') { fcDontKnowBtn.click(); return; }
        }

        // Type-in: Escape=Don't Know
        if (!typeinArea.classList.contains('d-none')) {
            if (e.key === 'Escape') { tiDontKnowBtn.click(); return; }
        }
    });

    // --- Submit ---
    function submitResults() {
        fetch('/sort/apply', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                results: results,
                source_theme_id: sourceThemeId,
                target_themes: targetThemes
            })
        })
        .then(r => r.json())
        .then(data => {
            window.location.href = data.redirect;
        });
    }

    showWord();
});
</script>
{% endblock %}
