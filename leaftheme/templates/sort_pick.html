{% extends 'base.html' %}

{% block content %}
<h2 class="mt-4">Sort Theme</h2>
<p class="text-muted">Pick a theme to sort its words into Know Well / Know / Don't Know / To Reverse.</p>
<ul class="list-group mt-3" style="max-width: 500px;">
    {% for theme in themes %}
    <a href="/sort/{{ theme.id }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
        {{ theme.name }}
        <span class="badge bg-primary rounded-pill">{{ theme.word_count() }}</span>
    </a>
    {% endfor %}
</ul>
{% endblock %}
