{% extends 'base.html' %}

{% block content %}
<h2 class="mt-4">Themes</h2>
<table class="table table-sm align-middle mt-3" style="max-width: 480px;">
    <tbody>
    {% for x in themes %}
    <tr>
        <td><a href="/words/{{ x.id }}">{{ x.name }}</a></td>
        <td class="text-end text-muted">{{ x.word_count() }} word{{ 's' if x.word_count() != 1 }}</td>
        <td class="text-end"><a href="/add_word?theme_id={{ x.id }}">add word</a></td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
