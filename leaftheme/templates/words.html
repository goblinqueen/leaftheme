{% extends 'base.html' %}

{% block content %}
<h2 class="mt-4">{{ theme.name }}</h2>
<p class="text-muted">{{ word_count }} word{{ 's' if word_count != 1 }}</p>
<a href="/add_word?theme_id={{ theme.id }}" class="btn btn-sm btn-outline-primary mt-2">Add word</a>
{% if test_ids %}
<a href="/test/flashcard?word_ids={{ test_ids }}&return_url=/words/{{ theme.id }}" class="btn btn-sm btn-outline-secondary mt-2">Test Flashcard</a>{% endif %}
{% endblock %}
